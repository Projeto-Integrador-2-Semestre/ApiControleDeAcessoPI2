spring.application.name=ControleDeAcesso

# Porta HTTP: o Render informa a porta na variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Carrega variaveis locais do arquivo .env (nao versionado). Veja .env.example
spring.config.import=optional:file:.env[.properties]

# Cloudflare D1 (banco "projetointegrador")
cloudflare.d1.account-id=${CLOUDFLARE_ACCOUNT_ID:ba13ee9c7fe70785e1f33584181ae7f2}
cloudflare.d1.database-id=${CLOUDFLARE_D1_DATABASE_ID:1f5d228d-4a97-43aa-8b9f-87fd8c859f47}
cloudflare.d1.api-token=${CLOUDFLARE_API_TOKEN:}
# Executa um SELECT 1 na subida da aplicacao para validar a conexao
cloudflare.d1.verificar-conexao=true
# URL da API REST do Cloudflare (troque so para apontar para um D1 falso em testes locais)
cloudflare.d1.base-url=${CLOUDFLARE_D1_BASE_URL:https://api.cloudflare.com/client/v4}
# Cria as tabelas catraca/liberacao_catraca na subida (se nao existirem)
cloudflare.d1.criar-tabelas=true

# Origens liberadas no CORS (front-end), separadas por virgula. "*" libera todas.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Tempo (s) que uma liberacao manual de catraca espera o tablet buscar antes de expirar
catraca.liberacao.validade-segundos=${LIBERACAO_VALIDADE_SEGUNDOS:30}

# Login (JWT). Em producao defina ADMIN_SENHA e JWT_SEGREDO (minimo 32 caracteres) no Render.
# Sem JWT_SEGREDO a chave e sorteada na subida e os logins caem quando a API reinicia.
seguranca.habilitada=${SEGURANCA_HABILITADA:true}
seguranca.admin-usuario=${ADMIN_USUARIO:admin}
seguranca.admin-senha=${ADMIN_SENHA:1234}
seguranca.admin-nome=${ADMIN_NOME:Administrador}
seguranca.jwt-segredo=${JWT_SEGREDO:}
seguranca.jwt-validade-horas=${JWT_VALIDADE_HORAS:8}

# face_api: avisada (POST /faces/reload) quando uma pessoa e cadastrada, editada, bloqueada ou excluida,
# para o reconhecimento valer na hora. Vazio = nao avisa (a face_api rele a tabela sozinha a cada 60 s).
face-api.url=${FACE_API_URL:}
